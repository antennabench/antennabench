name: Desktop release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Validate stable tag and source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout complete source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Validate release tag, version, source, and main reachability
        run: mise run desktop:publication-validate-tag -- "${{ github.ref_name }}"

  preflight:
    name: Fresh non-secret supply-chain preflight
    permissions:
      contents: read
    uses: ./.github/workflows/rust-supply-chain.yml

  build:
    name: Build verified input (${{ matrix.target }})
    needs: [tag, preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Run portable and unattended desktop verification
        run: |
          mise run desktop:release-test
          mise run test
          mise run desktop:frontend-test
          mise run desktop:e2e

      - name: Build exact non-publishable native input
        run: >-
          mise run desktop:release-bundle --
          "${{ matrix.target }}"
          --tag "${{ github.ref_name }}"
          --runner-label "${{ matrix.runner }}"

      - name: Upload manifest-bound signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-input-${{ matrix.target }}
          path: target/desktop-release/non-publishable/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Verify unsigned Mac archive (${{ matrix.target }})
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Download exact native release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-input-${{ matrix.target }}
          path: target/desktop-publication/download/${{ matrix.target }}

      - name: Verify and extract the manifest-bound native input
        run: >-
          mise run desktop:publication-prepare --
          "target/desktop-publication/download/${{ matrix.target }}"
          "target/desktop-publication/staging/${{ matrix.target }}"
          "${{ matrix.target }}"
          "${{ github.ref_name }}"
          "${{ github.sha }}"

      - name: Verify unsigned policy and stage the publishable archive
        run: >-
          mise run desktop:release-stage --
          "target/desktop-publication/staging/${{ matrix.target }}/AntennaBench.app"
          "${{ matrix.target }}"
          --trust-mode unsigned-macos
          --tag "${{ github.ref_name }}"
          --runner-label "${{ matrix.runner }}"

      - name: Upload exact publishable target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-ready-${{ matrix.target }}
          path: target/desktop-release/publishable/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build and verify unsigned Windows installer
    needs: [tag, preflight]
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Run portable and unattended desktop verification
        run: |
          mise run desktop:release-test
          mise run test
          mise run desktop:frontend-test
          mise run desktop:e2e

      - name: Build and verify native installer input
        run: >-
          mise run desktop:release-bundle --
          x86_64-pc-windows-msvc
          --tag "${{ github.ref_name }}"
          --runner-label windows-2025

      - name: Verify unsigned installer and stage publishable Windows bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          mise run desktop:release-stage --
          "target/desktop-release/non-publishable/x86_64-pc-windows-msvc/AntennaBench-${RELEASE_TAG#v}-x86_64-pc-windows-msvc-setup.exe"
          x86_64-pc-windows-msvc
          --trust-mode release
          --tag "$RELEASE_TAG"
          --runner-label windows-2025

      - name: Upload exact publishable Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-ready-x86_64-pc-windows-msvc
          path: target/desktop-release/publishable/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble exact publishable set
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Download Apple silicon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-ready-aarch64-apple-darwin
          path: target/desktop-publication/ready/aarch64-apple-darwin

      - name: Download Intel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-ready-x86_64-apple-darwin
          path: target/desktop-publication/ready/x86_64-apple-darwin

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-ready-x86_64-pc-windows-msvc
          path: target/desktop-publication/ready/x86_64-pc-windows-msvc

      - name: Assemble exact manifest, packages, and checksums
        run: >-
          mise run desktop:release-assemble --
          target/desktop-publication/ready/aarch64-apple-darwin
          target/desktop-publication/ready/x86_64-apple-darwin
          target/desktop-publication/ready/x86_64-pc-windows-msvc
          --require-publishable

      - name: Reverify the five final assets
        run: mise run desktop:release-verify -- target/desktop-release/publishable/complete

      - name: Upload complete release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-complete
          path: target/desktop-release/publishable/complete
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest exact release bytes
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-complete
          path: target/desktop-release/publishable/complete

      - name: Generate GitHub build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: target/desktop-release/publishable/complete/*

  publish:
    name: Create or verify private draft
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout complete tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Download complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-complete
          path: target/desktop-release/publishable/complete

      - name: Verify the mutation input
        run: mise run desktop:release-verify -- target/desktop-release/publishable/complete

      - name: Generate release notes
        run: >-
          mise run desktop:publication-notes --
          "${{ github.ref_name }}"
          target/desktop-publication/release-notes.md
          --release-dir target/desktop-release/publishable/complete

      - name: Create or safely resume an exact draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run desktop:publication-publish-draft --
          target/desktop-release/publishable/complete
          target/desktop-publication/release-notes.md
          "${{ github.ref_name }}"

  verify:
    name: Verify downloaded draft (${{ matrix.target }})
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout complete tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Download and verify final draft bytes and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run desktop:publication-verify-draft --
          "${{ github.ref_name }}"
          "${{ matrix.target }}"
          "target/desktop-publication/downloaded-draft/${{ matrix.target }}"
