name: Fresh Rust supply-chain preflight

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - ".mise/config.toml"
      - "deny.toml"
      - ".github/dependency-exceptions.json"
      - ".github/workflows/rust-supply-chain.yml"
      - ".mise/tasks/advisory-fresh"
      - ".mise/tasks/dependency-policy"
      - ".mise/tasks/release-preflight"
  push:
    branches:
      - main
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Fresh non-secret supply-chain preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Run release-grade supply-chain preflight
        run: mise run release-preflight
