name: Fresh Rust supply-chain preflight

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Fresh non-secret supply-chain preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine whether fresh Rust verification is required
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            "Cargo.lock" \
            "Cargo.toml" \
            ":(glob)**/Cargo.toml" \
            ".mise/config.toml" \
            "deny.toml" \
            ".github/dependency-exceptions.json" \
            ".github/workflows/rust-supply-chain.yml" \
            ".mise/tasks/advisory-fresh" \
            ".mise/tasks/dependency-policy" \
            ".mise/tasks/release-preflight"
          diff_status=$?
          set -e

          case "$diff_status" in
            0) echo "required=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "required=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$diff_status" ;;
          esac

      - name: Set up mise
        if: steps.scope.outputs.required == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.6
          github_token: ${{ github.token }}

      - name: Run release-grade supply-chain preflight
        if: steps.scope.outputs.required == 'true'
        run: mise run release-preflight
